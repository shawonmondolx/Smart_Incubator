; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; PARTITION TABLE: every env, including the diagnostic test envs, must pin
; board_build.partitions to the same value as the main firmware. Without it a
; test env silently falls back to the board default table, so every diagnostic
; flash swaps the layout back and forth. NVS happens to sit at 0x9000 in both
; huge_app.csv and the default table, which is the only reason saved settings
; survived - do not rely on that. Keep them pinned so it can never become a
; data-loss path.

[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_dtr = 0
monitor_rts = 0
upload_port = COM5
monitor_port = COM5
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    h2zero/NimBLE-Arduino@^2.3.6
    adafruit/DHT sensor library@^1.4.7
    adafruit/RTClib@^2.1.4
    milesburton/DallasTemperature@^4.0.5
    madhephaestus/ESP32Servo@^3.0.6
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; The loop task calls deep HTTPS/TLS chains (telemetry PUTs, nested token
    ; refresh); the 8 KB default stack overflows and reboots the ESP. 16 KB
    ; covers the worst chain with headroom.
    -DARDUINO_LOOP_STACK_SIZE=16384

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter = +<control_logic.cpp>
; The ESP32 FPU is single-precision. The 32-bit MinGW host defaults to x87
; 80-bit extended precision, which computes `a + b` differently from the
; compile-time-rounded float constants used in tests; that excess precision
; flips borderline hysteresis comparisons. SSE math rounds every intermediate
; to the declared type, matching the target arithmetic.
build_flags = -std=gnu++11 -mfpmath=sse -msse2

[env:gpio25-test]
platform = espressif32
board = nodemcu-32s
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = -<*> +<../test_gpio25/main.cpp>
lib_deps =

; Isolated XY-MOS heater output test. No Wi-Fi, no cloud, no sensors, no safety
; gates - it drives GPIO 32 directly so the heater and the reset can be
; diagnosed with every other subsystem removed as a variable.
; Flash with:  pio run -e heater-test -t upload
[env:heater-test]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM5
monitor_port = COM5
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<../test_heater/main.cpp>
lib_deps =

; Isolated servo hardware test. No Wi-Fi, no cloud, no sensors, no heater, no
; safety gates - the two servos are the ONLY load, so a reset that happens while
; they move is attributable to the servo supply/ground wiring.
; Flash with:  pio run -e servo-test -t upload
[env:servo-test]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM5
monitor_port = COM5
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<../test_servo/main.cpp>
lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
